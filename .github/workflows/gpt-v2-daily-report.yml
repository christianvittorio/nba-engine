name: gpt-v2-daily-readable-report

on:
  schedule:
    - cron: "30 10 * * *"      # Early US morning, ahead of weekend early tips
    - cron: "30 17 * * *"      # Midday ET follow-up for not-yet-logged games
    - cron: "30 22 * * 1-5"    # Weekday evening, after Claude's pretip injury refresh
  workflow_dispatch:
    inputs:
      date:
        description: "US Eastern date YYYY-MM-DD (blank = Eastern today and tomorrow)"
        required: false
        default: ""
      simulations:
        description: "Per-game simulation count (>=50; recommended 1000)"
        required: false
        default: "1000"
  pull_request:
    paths:
      - "gpt_engine/v2/daily_publish.py"
      - "gpt_engine/v2/research.py"
      - "gpt_engine/v2/tests/test_daily_publish.py"
      - ".github/workflows/gpt-v2-daily-report.yml"
      - "gpt_engine/v2/odds_ingest.py"
      - "gpt_engine/v2/odds_api_io.py"
      - "gpt_engine/v2/five_book_board.py"
      - "gpt_engine/v2/hoopsapi_free.py"
      - "gpt_engine/v2/public_espn_odds.py"
      - "gpt_engine/v2/odds_map.py"
      - "gpt_engine/v2/market_run.py"
      - "gpt_engine/v2/parlay_research.py"
      - "gpt_engine/v2/alt_prop_research.py"
      - "gpt_engine/v2/daily_master_report.py"
      - "gpt_engine/v2/tests/test_daily_master_report.py"
      - "gpt_engine/v2/tests/test_alt_prop_research.py"
      - "gpt_engine/v2/tests/test_parlay_research.py"
      - "gpt_engine/v2/market_grade.py"
      - "gpt_engine/v2/market_results.py"

permissions:
  contents: write

concurrency:
  group: gpt-v2-daily-report-${{ github.ref }}
  # Cancel stale PR attempts; never cancel scheduled real forecast publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  forecast-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gpt_engine/v2/requirements-test.txt
      - name: Install GPT v2 dependencies
        run: python -m pip install -r gpt_engine/v2/requirements-test.txt
      - name: Verify report/immutable-ledger and time-cutoff tests
        run: |
          python -m compileall -q gpt_engine/v2
          python -m pytest -q gpt_engine/v2/tests/test_daily_publish.py
      - name: Build independent four-season NBA warehouse with official tip times
        run: |
          python -m gpt_engine.v2.ingest \
            --seasons 2024 2025 2026 2027 \
            --output /tmp/gpt-v2-daily.sqlite
      - name: Capture public NBA sportsbook odds (NO ACCOUNT, NO KEY)
        env:
          GPT_REPORT_DATE: ${{ inputs.date }}
        run: |
          # Two day-scoped public scoreboard queries maximum per run.
          # No API secrets, no payment, no fake books or lines.
          python -m gpt_engine.v2.public_espn_odds \
            --nba-db /tmp/gpt-v2-daily.sqlite \
            --ledger /tmp/gpt-v2-odds-log.jsonl \
            --report /tmp/gpt-v2-odds-capture.json \
            --date "${GPT_REPORT_DATE}"
      - name: Verify official-schedule sportsbook mapping in PR smoke
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report=json.loads(Path("/tmp/gpt-v2-odds-capture.json").read_text())
          assert report["requires_api_key"] is False
          assert report["research_only"] is True
          assert all(x.get("reason") for x in report["skipped"])
          print("OFFICIAL_NBA_ODDS_WAREHOUSE_SMOKE",{
            "mapped_official_games":report["mapped_games"],
            "new_pretip_quotes":report["new_quotes"],
            "actual_named_books":report["verified_bookmakers"],
            "rejected_reasons":dict(Counter(x["reason"] for x in report["skipped"])),
          })
          PY
      - name: Generate GPT v2 predictions and human-readable matchup reports
        env:
          GPT_REPORT_DATE: ${{ inputs.date }}
          GPT_REPORT_SIMS: ${{ inputs.simulations }}
        run: |
          SIMS="${GPT_REPORT_SIMS:-1000}"
          if [ "$SIMS" -lt 50 ] || [ "$SIMS" -gt 10000 ]; then
            echo "Simulation count must be between 50 and 10000"
            exit 1
          fi
          if [ -n "$GPT_REPORT_DATE" ]; then
            python -m gpt_engine.v2.daily_publish \
              --db /tmp/gpt-v2-daily.sqlite \
              --date "$GPT_REPORT_DATE" --n "$SIMS"
          else
            python -m gpt_engine.v2.daily_publish \
              --db /tmp/gpt-v2-daily.sqlite --n "$SIMS"
          fi
      - name: Compare frozen forecasts with captured sportsbook prices
        run: |
          python -m gpt_engine.v2.market_run \
            --forecast-ledger gpt_engine/v2/artifacts/forecast_log.jsonl \
            --root . \
            --odds-ledger /tmp/gpt-v2-odds-log.jsonl \
            --output-json /tmp/gpt-v2-market-asof-latest.json \
            --output-md /tmp/gpt-v2-market-asof-latest.md
      - name: Render private five-book side-by-side comparison
        run: |
          python -m gpt_engine.v2.five_book_board \
            --asof-report /tmp/gpt-v2-market-asof-latest.json \
            --book-set observed \
            --output-json /tmp/gpt-v2-five-book-board.json \
            --output-md /tmp/gpt-v2-five-book-board.md
      - name: Rank positive-value single picks and highest-hit-probability parlay (research only)
        env:
          GPT_REPORT_DATE: ${{ inputs.date }}
        run: |
          ARGS=()
          if [ -n "${GPT_REPORT_DATE}" ]; then
            ARGS=(--date "${GPT_REPORT_DATE}")
          fi
          python -m gpt_engine.v2.parlay_research \
            --asof-report /tmp/gpt-v2-market-asof-latest.json \
            --output-json /tmp/gpt-v2-parlay-research-latest.json \
            --output-md /tmp/gpt-v2-parlay-research-latest.md \
            "${ARGS[@]}"
      - name: Audit high-usage 90%-season alternate props vs sourced defense groups
        env:
          GPT_REPORT_DATE: ${{ inputs.date }}
        run: |
          ARGS=()
          if [ -n "${GPT_REPORT_DATE}" ]; then
            ARGS=(--date "${GPT_REPORT_DATE}")
          fi
          python -m gpt_engine.v2.alt_prop_research \
            --db /tmp/gpt-v2-daily.sqlite \
            --odds-ledger /tmp/gpt-v2-odds-log.jsonl \
            --forecast-ledger gpt_engine/v2/artifacts/forecast_log.jsonl \
            --root . \
            --output-json /tmp/gpt-v2-usage-dvp-alt-prop.json \
            --output-md /tmp/gpt-v2-usage-dvp-alt-prop.md \
            "${ARGS[@]}"
      - name: Grade independently verified final NBA scores (no bets)
        run: |
          python -m gpt_engine.v2.market_results \
            --db /tmp/gpt-v2-daily.sqlite \
            --output /tmp/gpt-v2-market-finals.json
          python -m gpt_engine.v2.market_grade \
            --asof-report /tmp/gpt-v2-market-asof-latest.json \
            --odds-ledger /tmp/gpt-v2-odds-log.jsonl \
            --finals-json /tmp/gpt-v2-market-finals.json \
            --output /tmp/gpt-v2-market-evaluation-latest.json
      - name: Assemble and archive unified daily research Markdown (no raw provider odds)
        env:
          GPT_REPORT_DATE: ${{ inputs.date }}
        run: |
          ARGS=()
          if [ -n "${GPT_REPORT_DATE}" ]; then
            ARGS=(--date "${GPT_REPORT_DATE}")
          fi
          python -m gpt_engine.v2.daily_master_report \
            --db /tmp/gpt-v2-daily.sqlite \
            --report-dir gpt_engine/v2/artifacts/reports \
            --asof-report /tmp/gpt-v2-market-asof-latest.json \
            --parlay-json /tmp/gpt-v2-parlay-research-latest.json \
            --alt-prop-json /tmp/gpt-v2-usage-dvp-alt-prop.json \
            --evaluation-json /tmp/gpt-v2-market-evaluation-latest.json \
            "${ARGS[@]}"
      - name: Audit private market research output without publishing provider prices
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          report=json.loads(Path("/tmp/gpt-v2-market-asof-latest.json").read_text())
          graded=json.loads(Path("/tmp/gpt-v2-market-evaluation-latest.json").read_text())
          assert report["research_only"] is True
          assert graded["research_only"] is True
          parlays=json.loads(Path("/tmp/gpt-v2-parlay-research-latest.json").read_text())
          assert parlays["research_only"] is True
          assert parlays["actionable"] is False
          assert parlays["betting_recommendation"] is None
          assert parlays["ranking_metric"] == "full_win_probability_independent"
          alt=json.loads(Path("/tmp/gpt-v2-usage-dvp-alt-prop.json").read_text())
          assert alt["research_only"] is True
          assert alt["actionable"] is False
          assert alt["betting_recommendation"] is None
          assert alt["same_book_parlay"] is None or all(
             not item["actionable"] for item in alt["same_book_parlay"]["legs"]
          )
          # Never say the 90% retrospective sample is 90% predictive certainty.
          assert all(row["raw_season_hit_rate"] >= 0.9 and
                     row["season_games"] >= alt["minimum_season_games"] and
                     row["opponent_defense"]["rank_most_allowed"] <= 5 and
                     row["position_group"] in ("G","F","C") for row in alt["candidates"])
          print("PRIVATE_USAGE_DVP_ALT_PROP_WATCHLIST",json.dumps({
             "status":alt["status"],
             "games_reviewed":alt.get("games_reviewed",0),
             "coverage":alt.get("defense_coverage",[]),
             "prior_final_freshness":alt.get("prior_final_freshness",[]),
             "source_sample_exclusion_counts":alt.get("exclusion_counts",{}),
             "candidate_count":len(alt["candidates"]),
             "watchlist":[{
                 "player":c["player"],
                 "game_id":c["game_id"],
                 "position_group":c["position_group"],
                 "estimated_usage_percent":c["estimated_usage_percent"],
                 "team_usage_rank":c["team_usage_rank"],
                 "stat":c["stat"],
                 "unpriced_statistical_alt_over":c["alt_over_line"],
                 "season_hits":c["season_hits"],
                 "season_games":c["season_games"],
                 "defense_stat_rank_most_allowed":c["opponent_defense"]["rank_most_allowed"],
                 "same_opponent_games":c["same_opponent_games"],
                 "availability":c["availability"],
             } for c in alt["candidates"][:15]],
             "priced_alt_legs":len(alt["priced_alternate_legs"]),
             "source_priced_parlay_found":alt["same_book_parlay"] is not None,
             "missing_requirements":alt["missing_requirements"],
             "status_note":"OBSERVED_90PCT_SEASON_IS_NOT_90PCT_FUTURE_PROBABILITY"
          }))

          assert parlays["single_ranking_metric"] == "model_probability"
          assert parlays["filters"]["minimum_leg_roi"] > 0
          assert all(item["model_probability"] >=
                     parlays["filters"]["minimum_single_win_probability"]
                     for item in parlays["ranked_high_hit_singles"])
          # Public team names from the independently sourced NBA database;
          # never publish a provider's raw odds or sportsbook source payload.
          con=sqlite3.connect("/tmp/gpt-v2-daily.sqlite")
          lookup={gid:f"{away} @ {home}" for gid,away,home in con.execute(
            "SELECT g.game_id,a.current_name,h.current_name FROM games g "
            "JOIN teams a ON a.team_id=g.away_team_id "
            "JOIN teams h ON h.team_id=g.home_team_id")}
          con.close()
          print("PRIVATE_HIGH_HIT_SINGLES",json.dumps({
             "status":parlays["single_selection_status"],
             "ranking_metric":parlays["single_ranking_metric"],
             "minimum_model_probability":parlays["filters"]["minimum_single_win_probability"],
             "minimum_model_roi":parlays["filters"]["minimum_leg_roi"],
             "singles":[{
                 "matchup":lookup.get(leg["game_id"],leg["game_id"]),
                 "game_id":leg["game_id"],
                 "market_type":leg["market_type"],
                 "side":leg["selection"],
                 "line":leg["line"],
                 "book":leg["book"],
                 "model_win_probability":round(leg["model_probability"],4),
                 "bookmaker_break_even_probability":round(
                     leg["bookmaker_break_even_win_probability"],4),
                 "model_estimated_roi":round(leg["individual_research_roi"],4),
             } for leg in parlays["ranked_high_hit_singles"]],
             "unvalidated_model":True,
          }))
          best=parlays["best_research_combination"]
          print("PRIVATE_PARLAY_RESEARCH",json.dumps({
             "status":parlays["status"],
             "screened":parlays["candidate_tickets_screened"],
             "ranking_metric":parlays["ranking_metric"],
             "best_raw_roi_independent":(
                  round(best["estimated_roi_independent"],4) if best else None),
             "joint_full_win_probability":(
                  round(best["full_win_probability_independent"],4) if best else None),
             "single_sportsbook":best["book"] if best else None,
             "legs":([{
                 "game_id":l["game_id"],
                 "matchup":lookup.get(l["game_id"],l["game_id"]),
                 "model_win_probability":round(l["model_probability"],4),
                 "market_type":l["market_type"],
                 "side":l["selection"],
                 "line":l["line"],
             } for l in best["legs"]] if best else []),
             "status_note":"UNCALIBRATED_RESEARCH_NOT_AN_ACTIONABLE_PICK",
          }))
          print("PRIVATE_MARKET_RUN",json.dumps({
             "slate_games":len(report["games"]),
             "price_observations_before_cutoff":report["usable_asof_quote_count"],
             "graded_games":graded["calibration"]["settled_game_count"],
             "provisional_status":"UNCALIBRATED_RESEARCH"
          }))
          PY
      - name: Check every saved pretip forecast and generated Markdown report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from gpt_engine.v2.daily_publish import REPORTS,read_ledger
          from gpt_engine.v2.contracts import utc
          forecasts=read_ledger()
          found=list(REPORTS.glob("daily_*.md"))
          unified=list(REPORTS.glob("research_*.md"))
          assert found,"Expected a daily Markdown file even when there are no scheduled games"
          assert unified,"Expected consolidated daily research Markdown"
          for path in unified:
              date=path.stem.replace("research_","")
              original=REPORTS/f"daily_{date}.md"
              assert original.is_file(), "Master report cannot outlive missing source"
              md=path.read_text()
              assert f"Unified Daily Research — {date}" in md
              assert "High-hit single-game" in md
              assert "90%-season-hit alt props" in md
              assert "NO SOURCE-VERIFIED ALTERNATE-PROP PARLAY" in md or (
                 "Research-only, uncalibrated source-priced alt parlay" in md
              )
              assert "NOT sourced or imported" in md
              assert "raw provider odds" in md.lower()
              assert "## Detailed game-by-game forecasts" in md
          print("Consolidated daily research Markdown reports:",len(unified))
          for f in forecasts:
              detail=json.loads(Path(f["file"]).read_text())
              assert utc(detail["cutoff_utc"])<utc(detail["tip_utc"])
              assert detail["prediction_id"]==f["prediction_id"]
              assert detail["model_version"]==f["model_version"]
              assert "player_statistics" in detail["result"]
              assert detail.get("confirmed_starting_lineups") is False
          for path in found:
              md=path.read_text()
              assert "Slate at a glance" in md
              assert "Game-by-game breakdown" in md
              assert "Situational" in md or "situational" in md
              assert "RESEARCH / UNCALIBRATED" in md
          print("Valid immutable pretip forecast rows:",len(forecasts))
          print("Readable daily reports:",len(found))
          PY
      - name: Publish reports and immutable forecast ledger to GitHub
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "gpt-v2-report-bot"
          git config user.email "gpt-v2-report-bot@users.noreply.github.com"
          git add -f gpt_engine/v2/artifacts/reports/
          if [ -f gpt_engine/v2/artifacts/forecast_log.jsonl ]; then
            git add -f gpt_engine/v2/artifacts/forecast_log.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No GPT v2 reports to publish"
            exit 0
          fi
          git commit -m "gpt v2: dated human-readable pretip NBA report"
          for attempt in 1 2 3 4; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Unable to push GPT v2 forecasts; no pregame reports claimed published"
          exit 1
      - name: Attach report artifacts for pull-request verification
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gpt-v2-readable-daily-report-smoke
          path: |
            gpt_engine/v2/artifacts/reports/
            gpt_engine/v2/artifacts/forecast_log.jsonl
          if-no-files-found: error
