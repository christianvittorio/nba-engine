name: gpt-v2-market-value-research
on:
  pull_request:
    paths:
      - "gpt_engine/v2/market_value.py"
      - "gpt_engine/v2/tests/test_market_value.py"
      - "gpt_engine/v2/MARKET_VALUE_RESEARCH.md"
      - ".github/workflows/gpt-v2-market-value-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-value-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit-test dependency
        run: python -m pip install pytest
      - name: Compile market comparator
        run: python -m compileall -q gpt_engine/v2/market_value.py
      - name: Verify odds, vig, push, timestamp and calibration safeguards
        run: python -m pytest -q gpt_engine/v2/tests/test_market_value.py
