name: gpt-v2-2026-11-18-claude-asof-injuries

on:
  pull_request:
    paths:
      - "gpt_engine/v2/replay.py"
      - "gpt_engine/v2/replay_injuries.py"
      - "gpt_engine/v2/grade_replay.py"
      - ".github/workflows/gpt-v2-nov18-asof-injury-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-v2-asof-historic-injury-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blind-forecast-then-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gpt_engine/v2/requirements-test.txt
      - name: Install reproducible research dependencies
        run: python -m pip install -r gpt_engine/v2/requirements-test.txt
      - name: Recover original Claude injury report from true pre-tip git history
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=bef881fc0722a22291a35f304feba29ea4ad9656
          git cat-file -t "$SOURCE_COMMIT" | grep -x commit
          git show "$SOURCE_COMMIT:nba_engine/artifacts/availability.json" \
            > /tmp/claude-nov18-availability.json
          export COMMITTED_AT="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          raw=json.load(open('/tmp/claude-nov18-availability.json'))
          commit=datetime.fromisoformat(os.environ["COMMITTED_AT"])
          captured=datetime.fromisoformat(raw["generated_utc"].replace("Z","+00:00"))
          cutoff=datetime(2026,11,18,22,0,tzinfo=timezone.utc)
          first_tip=datetime(2026,11,19,0,0,tzinfo=timezone.utc)
          assert captured <= commit < cutoff < first_tip,(captured,commit,cutoff)
          assert len(raw["teams"])==30
          assert not raw["problems"],raw["problems"]
          print(f"Verified historical Git commit={commit.isoformat()} source_capture={captured.isoformat()} cutoff={cutoff.isoformat()}")
          PY
      - name: Compile modules and run v2 injury-leakage validation
        run: |
          python -m compileall -q gpt_engine/v2
          python -m pytest -q gpt_engine/v2/tests/test_shared_availability.py
      - name: Forecast all 12 games with and without pre-tip Claude injuries
        run: |
          python -m gpt_engine.v2.replay_injuries \
            --date 2026-11-18 \
            --cutoff-utc 2026-11-18T22:00:00Z \
            --claude-snapshot /tmp/claude-nov18-availability.json \
            --source-commit bef881fc0722a22291a35f304feba29ea4ad9656 \
            --n 1000 --seed 20261118 \
            --output /tmp/gpt-nov18-claude-injury-blind-forecasts.json \
            | tee /tmp/gpt-nov18-claude-injury-forecast.log
      - name: Verify blind forecast and real injury exclusion before opening finals
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/gpt-nov18-claude-injury-blind-forecasts.json"))
          assert d["game_count"]==12,d["game_count"]
          assert d["cutoff_utc"]=="2026-11-18T22:00:00Z"
          assert d["original_source_generated_utc"]=="2026-11-18T21:44:37Z"
          assert d["current_game_results_consulted"] is False
          assert len(set(g["game_id"] for g in d["games"]))==12
          assert all(g["tip_utc"]>d["cutoff_utc"] for g in d["games"])
          count_out=sum(len(g["injury_labels_applied"]["home_out"])+len(g["injury_labels_applied"]["away_out"]) for g in d["games"])
          assert count_out>0,"No actual player injuries applied"
          assert all(abs(g["team_minutes_after_injuries"][g["home"]]-240)<.001
                     and abs(g["team_minutes_after_injuries"][g["away"]]-240)<.001
                     for g in d["games"])
          print(f"BLIND_PRETIP_REPLAY_PASS 12 games, {count_out} matched rotation Out statuses")
          PY
          sha256sum /tmp/gpt-nov18-claude-injury-blind-forecasts.json > /tmp/forecast-hash-before-grading
      - name: Only now inspect game results to grade both forecasts
        run: |
          python -m gpt_engine.v2.grade_replay \
            --forecast /tmp/gpt-nov18-claude-injury-blind-forecasts.json \
            --output /tmp/gpt-nov18-claude-injury-graded.json \
            | tee /tmp/gpt-nov18-claude-injury-grade.log
          sha256sum /tmp/gpt-nov18-claude-injury-blind-forecasts.json > /tmp/forecast-hash-after-grading
          diff -u /tmp/forecast-hash-before-grading /tmp/forecast-hash-after-grading
      - name: Publish replay and grading separately
        uses: actions/upload-artifact@v4
        with:
          name: gpt-nov18-2026-authentic-claude-injuries-pretip-replay
          path: |
            /tmp/gpt-nov18-claude-injury-blind-forecasts.json
            /tmp/gpt-nov18-claude-injury-graded.json
            /tmp/gpt-nov18-claude-injury-forecast.log
            /tmp/gpt-nov18-claude-injury-grade.log
          if-no-files-found: error
