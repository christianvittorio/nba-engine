name: probe-espn-props
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python nba_engine/scripts/probe_espn_props.py | tee probe.txt
      - run: |
          git config user.name "nba-engine-bot"; git config user.email "nba-engine-bot@users.noreply.github.com"
          cp probe.txt nba_engine/artifacts/reports/probe_espn_props.txt
          git add -f nba_engine/artifacts/reports/probe_espn_props.txt; git commit -m "probe espn props" -q
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
