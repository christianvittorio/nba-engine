name: gpt-v2-nov20-2026-spoiler-free-report
on:
  pull_request:
    paths:
      - "gpt_engine/v2/replay_injuries.py"
      - "gpt_engine/v2/sample_nov20_report.py"
      - ".github/workflows/gpt-v2-nov20-spoiler-free-report.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct-pretip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gpt_engine/v2/requirements-test.txt
      - name: Install simulation dependencies
        run: python -m pip install -r gpt_engine/v2/requirements-test.txt
      - name: Authenticate actual Claude ESPN data from before Nov 20 game tips
        env:
          SOURCE_SHA: ef893052b88ab2a33baf688ce0a63e0b8e291066
        run: |
          git cat-file -t "$SOURCE_SHA" | grep -x commit
          git show "$SOURCE_SHA:nba_engine/artifacts/availability.json" > /tmp/nov20-original-claude-espn.json
          export SOURCE_COMMIT_TIME="$(git show -s --format=%cI "$SOURCE_SHA")"
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          raw=json.load(open("/tmp/nov20-original-claude-espn.json"))
          captured=datetime.fromisoformat(raw["generated_utc"].replace("Z","+00:00"))
          committed=datetime.fromisoformat(os.environ["SOURCE_COMMIT_TIME"])
          cutoff=datetime(2026,11,20,22,0,tzinfo=timezone.utc)
          assert captured<=committed<cutoff,(captured,committed,cutoff)
          assert len(raw["teams"])==30 and not raw["problems"]
          print("AUTHENTIC_PRETIP_ESPN",captured,committed,cutoff)
          PY
      - name: Run no-outcome unit tests and compile
        run: |
          python -m compileall -q gpt_engine/v2
          python -m pytest -q gpt_engine/v2/tests/test_shared_availability.py gpt_engine/v2/tests/test_situational_streaks.py gpt_engine/v2/tests/test_daily_publish.py
      - name: Reconstruct all 9 games with both injury-blind and injury-adjusted MC and render markdown
        run: |
          python -m gpt_engine.v2.sample_nov20_report \
            --source /tmp/nov20-original-claude-espn.json \
            --source-commit ef893052b88ab2a33baf688ce0a63e0b8e291066 \
            --n 1000 \
            --output /tmp/gpt-v2-nov20-2026-nine-game-pretip.md \
            --audit /tmp/gpt-v2-nov20-2026-nine-game-pretip.json \
            | tee /tmp/gpt-v2-nov20-report.log
      - name: Assert nine pregame games, original timestamp, no actual labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open("/tmp/gpt-v2-nov20-2026-nine-game-pretip.json"))
          md=Path("/tmp/gpt-v2-nov20-2026-nine-game-pretip.md").read_text()
          assert len(data["games"])==9
          assert data["date_eastern"]=="2026-11-20"
          assert data["cutoff_utc"]=="2026-11-20T22:00:00Z"
          assert not data["actual_scores_used"]
          assert data["source_generated_utc"]=="2026-11-20T21:42:40Z"
          assert md.count("### ")==9
          assert "Slate at a glance" in md and "Projected player box-score" in md
          assert "Situational" in md and "Source-observed player availability" in md
          assert "Retrospective reconstruction" in md
          assert md.count("| Player | Min | PTS | REB | AST | 3PM | TOV |")==9 or md.count("| Team | Player |")==9
          assert all("after_injuries" in g and "before_injuries" in g for g in data["games"])
          assert all(g["source_timestamp"]=="2026-11-20T21:42:40Z" for g in data["games"])
          print("ALL_9_GAMES_AND_FULL_PRETIP_HUMAN_REPORT_VERIFIED")
          PY
      - name: Upload entire spoiler-free report and provenance audit
        uses: actions/upload-artifact@v4
        with:
          name: gpt-v2-nov20-nine-game-report-pretip-only
          path: |
            /tmp/gpt-v2-nov20-2026-nine-game-pretip.md
            /tmp/gpt-v2-nov20-2026-nine-game-pretip.json
            /tmp/gpt-v2-nov20-report.log
          if-no-files-found: error
