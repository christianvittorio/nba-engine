name: refresh-forecast
on:
  schedule:
    - cron: "0 22 * * 1-5"    # 5pm ET on weekdays, before the 7pm tips
    - cron: "0 16 * * 0,6"    # noon ET on weekends, before the early tips
  workflow_dispatch:
    inputs:
      date: {description: "US Eastern date YYYY-MM-DD (empty = today)", required: false, default: ""}
permissions:
  contents: write
concurrency: nba-daily
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy tabulate
      - run: python scripts/refresh_forecast.py ${{ inputs.date }}
        working-directory: nba_engine
      - name: Keyless DraftKings player props from ESPN (never fails the job)
        run: python scripts/fetch_espn_props.py ${{ inputs.date }}
        working-directory: nba_engine
        continue-on-error: true
      - name: Re-check pair orientation and re-test the model against book lines (finished games)
        run: python scripts/props_orientation.py && python scripts/props_backtest.py
        working-directory: nba_engine
        continue-on-error: true
      - name: Fetch sportsbook prop lines (skipped without the ODDS_API_KEY secret; never fails the job)
        run: python scripts/fetch_prop_lines.py ${{ inputs.date }}
        working-directory: nba_engine
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: python scripts/best_picks.py ${{ inputs.date }}
        working-directory: nba_engine
      - name: Commit
        run: |
          git config user.name "nba-engine-bot"
          git config user.email "nba-engine-bot@users.noreply.github.com"
          git add -f nba_engine/artifacts/reports/refresh_*.md nba_engine/artifacts/reports/best_picks_*.md nba_engine/artifacts/live.sqlite nba_engine/artifacts/player_live.sqlite nba_engine/artifacts/availability.json nba_engine/artifacts/props_blend.json nba_engine/artifacts/reports/props_*.md
          git diff --cached --quiet || git commit -m "refresh forecast ${{ inputs.date }}"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
