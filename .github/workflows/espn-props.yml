name: espn-props
on:
  workflow_dispatch:
    inputs:
      from_date: {description: "first US Eastern date YYYY-MM-DD (empty = today)", required: false, default: ""}
      to_date: {description: "last US Eastern date (empty = same as first)", required: false, default: ""}
permissions:
  contents: write
concurrency: nba-daily
jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas
      - run: python scripts/fetch_espn_props.py ${{ inputs.from_date }} ${{ inputs.to_date }}
        working-directory: nba_engine
      - run: python scripts/props_orientation.py
        working-directory: nba_engine
        continue-on-error: true
      - run: |
          git config user.name "nba-engine-bot"; git config user.email "nba-engine-bot@users.noreply.github.com"
          git add -f nba_engine/artifacts/player_live.sqlite nba_engine/artifacts/reports/props_orientation.md
          git diff --cached --quiet || git commit -m "espn props ${{ inputs.from_date }}..${{ inputs.to_date }}"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
